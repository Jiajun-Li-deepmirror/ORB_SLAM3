%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# OpenLORIS-Scene office1-1: RealSense D435i color+depth+IMU, same camera intrinsics
# as Examples/RGB-D/OpenLORIS.yaml (d400_color_optical_frame, from the dataset's own
# office1-1/sensors.yaml), plus IMU coupling for the RGB-D-Inertial comparison.
Camera1.fx: 611.45098876953125
Camera1.fy: 611.48571777343750
Camera1.cx: 433.20397949218750
Camera1.cy: 249.47302246093750

Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

Camera.width: 848
Camera.height: 480

Camera.fps: 30

Camera.RGB: 1

Stereo.ThDepth: 40.0
Stereo.b: 0.0149

RGBD.DepthMapFactor: 1000.0

# Transformation from body-frame (imu, = d400_accelerometer/gyroscope -- co-located per
# office1-1/trans_matrix.yaml) to left camera (d400_color_optical_frame). Computed as the
# inverse of trans_matrix.yaml's d400_color_optical_frame<-d400_gyroscope tf_static entry
# (same derivation as Examples/Stereo-Inertial/OpenLORIS.yaml's IMU.T_b_c1 for T265).
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [ 9.9997545291464240e-01, -3.8286801217887346e-03, -5.8681152579773141e-03, -2.0227025175099400e-02,
           3.8491408362146826e-03,  9.9998653870758514e-01,  3.4794422608202015e-03, -5.2203450527416000e-03,
           5.8547145941429879e-03, -3.5019440527251228e-03,  9.9997672908166857e-01, -1.1302181840619100e-02,
           0.0, 0.0, 0.0, 1.0]

# Do not insert KFs when recently lost
IMU.InsertKFsWhenLost: 0

# IMU noise: office1-1/sensors.yaml reports zero noise_variances/bias_variances for
# d400_accelerometer/d400_gyroscope (unlike its T265 entries), so these values aren't
# usable to derive real sigmas. Falling back to Examples/RGB-D-Inertial/RealSense_D435i.yaml's
# standard D435i defaults (originally from VINS-Mono) instead.
IMU.NoiseGyro: 1e-2
IMU.NoiseAcc: 1e-1
IMU.GyroWalk: 1e-6
IMU.AccWalk: 1e-4
IMU.Frequency: 400.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
